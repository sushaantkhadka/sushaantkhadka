<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dodge Pro</title>
    <style>
        body {
            margin: 0; background-color: #111; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none;
        }
        #game-container { position: relative; border: 2px solid #333; line-height: 0; }
        canvas { background-color: #000; cursor: crosshair; display: block; }
        
        /* UI Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(0,0,0,0.85); z-index: 10;
            line-height: 1.5;
        }
        #ui-layer {
            position: absolute; top: 15px; width: 100%; pointer-events: none;
            display: flex; justify-content: space-around; font-size: 18px; color: #0f0;
            line-height: 1.5;
        }
        button {
            padding: 12px 28px; font-size: 18px; cursor: pointer;
            background: transparent; color: #0f0; border: 2px solid #0f0; margin: 10px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { background: #0f0; color: #000; }
        .hidden { display: none !important; }

        /* Fullscreen Icon Button */
        #fs-btn {
            position: absolute; bottom: 15px; right: 15px;
            background: none; border: 2px solid rgba(255,255,255,0.3);
            color: white; cursor: pointer; padding: 8px;
            width: 40px; height: 40px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; z-index: 20;
        }
        #fs-btn:hover { border-color: #0f0; color: #0f0; }
        #fs-btn svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div>SCORE: <span id="scoreVal">0</span></div>
            <div>BEST: <span id="highScore">0</span></div>
        </div>

        <div id="start-menu" class="overlay">
            <h1 style="letter-spacing: 8px;">Problems??</h1>
            <p style="color: #888;">Chill!!!! We will learn to dodge!!</p>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div id="death-menu" class="overlay hidden">
            <h1 style="color: #ff4444;">CRASHED</h1>
            <p id="final-score"></p>
            <button onclick="startGame()">Try Again</button>
        </div>

        <button id="fs-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        
        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const PLAYER_SIZE = 10;
    const ENEMY_SIZE = 14;
    const ENEMY_SPEED = 1.5; // Easier speed
    const PLAYER_LERP = 0.12; 
    
    let score = 0;
    let highScore = localStorage.getItem('dodge_highscore') || 0;
    document.getElementById('highScore').innerText = highScore;
    
    let gameActive = false;
    let enemies = [];
    let player = { x: 0, y: 0, targetX: 0, targetY: 0 };

    function resize() {
        canvas.width = Math.min(window.innerWidth, 600);
        canvas.height = Math.min(window.innerHeight, 600);
    }
    window.addEventListener('resize', resize);
    resize();

    function playSound(freq, type, duration, vol) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function startGame() {
        score = 0;
        document.getElementById('scoreVal').innerText = "0";
        enemies = [];
        gameActive = true;
        player.x = canvas.width/2; player.y = canvas.height/2;
        player.targetX = player.x; player.targetY = player.y;
        
        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('death-menu').classList.add('hidden');
        for(let i=0; i<3; i++) spawnEnemy();
    }

    function spawnEnemy() {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if (side === 0) { x = Math.random() * canvas.width; y = -30; }
        else if (side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
        else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
        else { x = -30; y = Math.random() * canvas.height; }
        enemies.push({ x, y });
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(e => console.log(e));
        } else {
            document.exitFullscreen();
        }
    }

    window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.clientX - rect.left;
        player.targetY = e.clientY - rect.top;
    });

    window.addEventListener('touchmove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.touches[0].clientX - rect.left;
        player.targetY = e.touches[0].clientY - rect.top;
        e.preventDefault();
    }, {passive: false});

    function update() {
        if (!gameActive) return;

        player.x += (player.targetX - player.x) * PLAYER_LERP;
        player.y += (player.targetY - player.y) * PLAYER_LERP;

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let dx = player.x - e.x;
            let dy = player.y - e.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            e.x += (dx/dist) * ENEMY_SPEED;
            e.y += (dy/dist) * ENEMY_SPEED;

            if (dist < PLAYER_SIZE + 2) endGame();

            for (let j = i - 1; j >= 0; j--) {
                let e2 = enemies[j];
                let edist = Math.sqrt((e2.x-e.x)**2 + (e2.y-e.y)**2);
                if (edist < ENEMY_SIZE) {
                    playSound(200, 'sine', 0.1, 0.1);
                    enemies.splice(i, 1);
                    enemies.splice(j, 1);
                    score += 10;
                    document.getElementById('scoreVal').innerText = score;
                    setTimeout(spawnEnemy, 1000);
                    setTimeout(spawnEnemy, 1800);
                    break;
                }
            }
        }
        if (Math.random() < 0.004) spawnEnemy();
    }

    function endGame() {
        if (!gameActive) return;
        gameActive = false;
        playSound(100, 'sawtooth', 0.4, 0.2);
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('dodge_highscore', highScore);
            document.getElementById('highScore').innerText = highScore;
        }
        document.getElementById('final-score').innerText = "SCORE: " + score;
        document.getElementById('death-menu').classList.remove('hidden');
    }

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0f0';
        ctx.beginPath();
        ctx.arc(player.x, player.y, PLAYER_SIZE, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#f44';
        enemies.forEach(e => {
            ctx.fillRect(e.x - ENEMY_SIZE/2, e.y - ENEMY_SIZE/2, ENEMY_SIZE, ENEMY_SIZE);
        });

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    draw();
</script>
</body>
</html>
